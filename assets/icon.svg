<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Spotlight Go</title>
  <defs>
    <linearGradient id="bg" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48C6FF"/>
      <stop offset=".52" stop-color="#2478FF"/>
      <stop offset="1" stop-color="#3C4BF2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="42" cy="30" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="34" y1="92" x2="88" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6F4FF"/>
      <stop offset=".45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#102985" flood-opacity=".24"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="61" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="61" fill="url(#sheen)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>
  <!-- Spotlight lens sweeping into a tapered launch beam, optically centered inside the circle. -->
  <path
    filter="url(#shadow)"
    fill="url(#mark)"
    transform="translate(64 64) scale(1.24) translate(-63.5 -62)"
    d="M44 65 A25 25 0 1 1 78 81 Q74 83 69 84 L34 92 L58 73 Q60 71 65 72 A15 15 0 1 0 53 58 Z"
  />
</svg>
