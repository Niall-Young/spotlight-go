<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Spotlight Go</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#222435;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f0f1fc;overflow:hidden}
.canvas{height:100vh;position:relative;overflow:hidden;background:linear-gradient(125deg,#f2f8fc,#f8f8fc 60%,#f3f2fb)}
.copy{position:absolute;left:100px;top:105px;z-index:2}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:550;letter-spacing:-.3px}.brand img{width:34px;height:34px}
h1{font-size:48px;line-height:1.25;letter-spacing:-1px;margin:43px 0 20px;font-weight:600}p{font-size:17px;color:#737583;margin:0;line-height:1.8}
.preview{position:absolute;left:700px;top:112px;width:760px;height:475px;border:5px solid #ffffffc0;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #5553890c;transform:rotate(-3deg)}.preview img{width:100%;height:100%;object-fit:cover}
.key{margin-top:29px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#777988}.key span{border:1px solid #dddfe8;background:#ffffff60;padding:6px 9px;border-radius:5px}
body.small .copy{left:36px;top:33px}body.small .brand{font-size:14px;gap:8px}body.small .brand img{width:23px;height:23px}body.small h1{font-size:26px;letter-spacing:-.5px;margin:29px 0 14px}body.small p{font-size:12px;line-height:1.85}body.small .key{margin-top:24px;font-size:10px}body.small .key span{padding:4px 6px}body.small .preview{display:none}
</style>
<body>
<main class="canvas">
  <div class="copy">
    <div class="brand"><img src="../../assets/icon-128.png" alt="">spotlight-go</div>
    <h1>搜索，即刻聚焦</h1>
    <p>标签页、书签、历史，一处直达<br>让每个新标签页，清爽有序</p>
    <div class="key"><span>⌥ / Alt</span><span>Space</span></div>
  </div>
  <div class="preview"><img src="screenshot-light-1280x800.png" alt="Spotlight Go 新标签页"></div>
</main>
<script>document.body.className=new URLSearchParams(location.search).get('layout')==='small'?'small':'marquee'</script>
</body>
</html>
